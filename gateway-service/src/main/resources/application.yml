server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        - id: auth-service
          uri: http://auth-service:8086
          predicates:
            - Path=/microbank/auth/**
          filters:
            - StripPrefix=0

        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/microbank/users/**
          filters:
            - StripPrefix=0

        - id: merchant-service
          uri: http://merchant-service:8082
          predicates:
            - Path=/microbank/merchant/**
          filters:
            - StripPrefix=0

        - id: wallet-service
          uri: http://wallet-service:8083
          predicates:
            - Path=/microbank/wallets/**
          filters:
            - StripPrefix=0

        - id: transaction-service
          uri: http://transaction-service:8085
          predicates:
            - Path=/microbank/transactions/**
          filters:
            - StripPrefix=0

        - id: audit-service
          uri: http://audit-service:8084
          predicates:
            - Path=/microbank/audit/**
          filters:
            - StripPrefix=0

  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 01-Auth-Service
        url: /microbank/auth/v3/api-docs
      - name: 02-User-Service
        url: /microbank/users/v3/api-docs
      - name: 03-Transaction-Service
        url: /microbank/transactions/v3/api-docs
      - name: 04-Merchant-Service
        url: /microbank/merchant/v3/api-docs
      - name: 05-Wallet-Service
        url: /microbank/wallets/v3/api-docs
      - name: 06-Audit-Service
        url: /microbank/audit/v3/api-docs

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: "*"